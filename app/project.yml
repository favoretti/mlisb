name: mlisb
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_IDENTITY: "-"
    # Override on the command line (MLISB_BUNDLE_ID=…) for a side-by-side development build.
    MLISB_BUNDLE_ID: net.favoretti.mlisb
packages:
  MarkdownEngine:
    path: ../Vendor/MarkdownEngine
  MlisbKit:
    path: ../Kit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  mlisb:
    type: application
    platform: macOS
    sources:
      - Sources
      - Assets.xcassets
      - path: ../bin/mlisb
        buildPhase:
          copyFiles:
            destination: resources
            subpath: bin
    dependencies:
      - package: MarkdownEngine
        product: MarkdownEngine
      - package: MarkdownEngine
        product: MarkdownEngineCodeBlocks
      - package: MarkdownEngine
        product: MarkdownEngineLatex
      - package: MlisbKit
      - package: Sparkle
      - target: mlisbQuickLook
      - target: mlisbThumbnail
    scheme:
      testTargets: [mlisbTests]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: mlisb
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: net.favoretti.mlisb.cli
            CFBundleURLSchemes: [mlisb]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown, net.favoretti.mlisb.markdown-extra]
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
        # Extensions the system's markdown type doesn't claim; with md, markdown and mdown this is FolderSearch.extensions.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.favoretti.mlisb.markdown-extra
            UTTypeDescription: Markdown
            UTTypeConformsTo: [net.daringfireball.markdown]
            UTTypeTagSpecification:
              public.filename-extension: [mkd, mdx, qmd, rmd, mdc]
        SUFeedURL: https://github.com/favoretti/mlisb/releases/latest/download/appcast.xml
        SUPublicEDKey: hKvkZpU81lRfsYqGs/00iTPCBd6PQcYIYPAa4Z3qqTg=
        SUEnableAutomaticChecks: true
        SUEnableInstallerLauncherService: true
    entitlements:
      path: mlisb.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # WebKit's helper processes die without this, even for local content.
        com.apple.security.network.client: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MLISB_BUNDLE_ID)
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  mlisbTests:
    type: bundle.unit-test
    platform: macOS
    # The extension logic is compiled in directly so it can be unit-tested.
    sources:
      - Tests
      - QuickLook/PreviewContent.swift
      - QuickLook/PreviewViewController.swift
      - Thumbnail/ThumbnailText.swift
      - Thumbnail/ThumbnailProvider.swift
    dependencies:
      - target: mlisb
      - package: MarkdownEngine
        product: MarkdownEngine
      - package: MarkdownEngine
        product: MarkdownEngineCodeBlocks
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(MLISB_BUNDLE_ID).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/mlisb.app/Contents/MacOS/mlisb
        BUNDLE_LOADER: $(TEST_HOST)
  mlisbQuickLook:
    type: app-extension
    platform: macOS
    sources: [QuickLook]
    dependencies:
      - package: MarkdownEngine
        product: MarkdownEngine
      - package: MarkdownEngine
        product: MarkdownEngineCodeBlocks
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleDisplayName: mlisb Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [net.daringfireball.markdown, net.favoretti.mlisb.markdown-extra]
            QLIsDataBasedPreview: false
    entitlements:
      path: QuickLook/QuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MLISB_BUNDLE_ID).quicklook
        ENABLE_HARDENED_RUNTIME: YES
  mlisbThumbnail:
    type: app-extension
    platform: macOS
    sources: [Thumbnail]
    info:
      path: Thumbnail/Info.plist
      properties:
        CFBundleDisplayName: mlisb Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [net.daringfireball.markdown, net.favoretti.mlisb.markdown-extra]
            QLThumbnailMinimumDimension: 0
    entitlements:
      path: Thumbnail/Thumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MLISB_BUNDLE_ID).thumbnail
        ENABLE_HARDENED_RUNTIME: YES
