name: Feature request
description: Suggest something mlisb should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task or situation, not the solution yet. "I review an agent's plan and lose my place when it rewrites the file" is more useful than "add bookmarks".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working, if you have an idea.
  - type: textarea
    id: now
    attributes:
      label: What you do today
      description: Any workaround, or another way you handle it now.
